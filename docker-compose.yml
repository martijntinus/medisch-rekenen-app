services:
  medisch-rekenen-app:
    build: .
    image: medisch-rekenen-app:0.2.2
    ports:
      - "8912:8912"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:8912/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
